<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Check-in · KBTU OPEN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9; color: #0f172a; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    form {
      width: 100%; max-width: 340px; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 14px; padding: 24px;
    }
    h1 { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
    p { color: #64748b; font-size: .9rem; margin-bottom: 18px; }
    input {
      width: 100%; padding: 14px; font-size: 22px; letter-spacing: .3em; text-align: center;
      border: 1px solid #e2e8f0; border-radius: 10px; outline: none; background: #f8fafc;
    }
    input:focus { border-color: #2563eb; background: #fff; }
    button {
      width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 10px;
      background: #2563eb; color: #fff; font-size: 1rem; font-weight: 700;
    }
    .error {
      background: #fee2e2; color: #b91c1c; border-radius: 8px; padding: 10px 12px;
      font-size: .9rem; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>Check-in</h1>
    <p>Введите пин-код от организаторов</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="pin" inputmode="numeric" autocomplete="off" autofocus required>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
